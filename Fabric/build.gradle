plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
    id 'net.darkhax.curseforgegradle'
    id 'com.modrinth.minotaur'
}

def useLocalYungsApi = findProject(':yungsapi') != null

repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://maven.minecraftforge.net/" } // for terrablender
    maven { url = "https://libs.geckolib.com/" } // for geckolib
}

dependencies {
    minecraft "com.mojang:minecraft:${mc_version}"

    // YUNG's API
    if (useLocalYungsApi) {
        implementation files("libs/YungsApi-${mc_version}-Fabric-${yungsapi_version}.jar")
    } else {
        implementation "com.yungnickyoung.minecraft.yungsapi:YungsApi:${mc_version}-Fabric-${yungsapi_version}"
    }

    // Fabric
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}+${mc_version}"

    // Reflections
    implementation(include("org.reflections:reflections:0.10.2"))

    // ClothConfig
    implementation "me.shedaniel.cloth:cloth-config-fabric:${project.clothconfig_version_fabric}"

    // ModMenu
    implementation ("com.terraformersmc:modmenu:${project.modmenu_version_fabric}") { transitive = false }

    // Geckolib
    implementation ("com.geckolib:geckolib-fabric-${mc_version}:${geckolib_version}")

    // Terrablender
    implementation ("com.github.glitchfiend:TerraBlender-fabric:${mc_version}-${terrablender_version}")
}

loom {
    def aw = project(':Common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("runs/client")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("runs/server")
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}

String[] compatibleVersions = project.compatible_versions.split(',')
task publishCurseForgeFabric(type: net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    dependsOn(tasks.jar)
    apiToken = curseforgeApiKey

    debugMode = debug_publish.toBoolean()

    def mainFile = upload(curseforge_project_id_fabric, tasks.jar.archiveFile)
    mainFile.changelogType = 'markdown'
    mainFile.changelog = file("../CHANGELOG.md").exists() ? file("../CHANGELOG.md").text : "No changelog provided"
    mainFile.releaseType = 'release'
    mainFile.addRequirement('yungs-api-fabric')
    mainFile.addRequirement('fabric-api')
    mainFile.addRequirement('cloth-config')
    mainFile.addOptional('modmenu')
    mainFile.displayName = "[${mc_version}] ${mod_full_name} v${rawVersion} (Fabric)"
    compatibleVersions.each { version ->
        mainFile.addGameVersion(version)
    }
}

List compatibleVersionsList = project.compatible_versions.split(',')
modrinth {
    token = modrinthToken
    projectId = modrinth_project_id
    versionNumber = version
    versionName = "[${mc_version}] v${rawVersion} (Fabric)"
    versionType = "release"
    uploadFile = jar
    gameVersions = compatibleVersionsList
    debugMode = debug_publish.toBoolean()
    changelog = file("../CHANGELOG.md").exists() ? file("../CHANGELOG.md").text : "No changelog provided"
    dependencies { // A special DSL for creating dependencies
        // scope.type
        // The scope can be `required`, `optional`, `incompatible`, or `embedded`
        // The type can either be `project` or `version`
        required.project "yungs-api"
        required.project "fabric-api"
        required.project "cloth-config"
        optional.project "modmenu"
    }
}
tasks.modrinth.dependsOn(tasks.jar)